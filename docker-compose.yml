services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile_ui
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
